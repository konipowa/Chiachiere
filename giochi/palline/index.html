<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Palline d'Acquario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
  :root{ --ink:#0f1724; --foam:#eaf9ff; --coral:#ff5e7a; --gold:#ffd54a; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background:radial-gradient(120% 80% at 50% 0%, #2a8fc4 0%, #135b8c 45%, #06304f 100%);
    font-family:"Fredoka", ui-rounded, "Segoe UI", system-ui, sans-serif;
    color:var(--foam);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom);
    user-select:none;
  }
  #hud{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px;}
  .box{display:flex;flex-direction:column;line-height:1;}
  .box .n{font-size:27px;font-weight:700;letter-spacing:-.5px;}
  .box .l{font-size:11px;font-weight:500;opacity:.72;margin-top:3px;}
  .box.small .n{font-size:16px;opacity:.92;}
  #coins .n{color:var(--gold);}
  #xpbar{width:46px;height:5px;border-radius:99px;background:rgba(234,249,255,.22);margin-top:6px;overflow:hidden;}
  #xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ef0c0,#39d0ff);border-radius:99px;transition:width .3s ease;}
  .ms{display:flex;flex-direction:column;gap:5px;}
  .bar{height:6px;border-radius:99px;background:rgba(234,249,255,.18);overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--gold);border-radius:99px;}
  .card.doneM{border-color:#7ef0c0;}
  .slider{width:100%;accent-color:var(--gold);height:22px;}
  .buffLine{grid-column:1/-1;font-size:12px;opacity:.8;padding:2px 2px 6px;line-height:1.35;}
  #nextWrap{display:flex;align-items:center;gap:7px;background:rgba(234,249,255,.92);
    border:3px solid var(--ink);border-radius:14px;padding:4px 9px 4px 11px;box-shadow:0 4px 0 rgba(15,23,36,.5);}
  #nextWrap .l{font-size:12px;font-weight:600;color:var(--ink);}
  #nextCv{display:block;width:32px;height:32px;}
  #stage{position:relative;line-height:0;}
  canvas#c{display:block;touch-action:none;border-radius:18px;border:3px solid rgba(15,23,36,.6);
    box-shadow:0 14px 40px rgba(0,20,40,.45);}
  .panel{position:absolute;inset:0;border-radius:18px;background:rgba(6,26,44,.92);
    display:none;flex-direction:column;overflow:hidden;}
  .panel.show{display:flex;}
  #menu{align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;
    background:linear-gradient(180deg, rgba(4,20,38,.55), rgba(4,20,38,.86));}
  #mTitle{font-size:34px;font-weight:700;line-height:1.02;text-shadow:0 5px 0 rgba(8,26,44,.6);}
  #mTitle span{font-size:26px;opacity:.92;}
  #mBest, #pauseBest{font-size:12.5px;letter-spacing:2px;opacity:.72;text-transform:uppercase;}
  #menu button{min-width:170px;}
  #nickRow{display:flex;align-items:center;gap:8px;background:rgba(234,249,255,.1);
    border:2px solid rgba(234,249,255,.28);border-radius:999px;padding:5px 7px 5px 14px;}
  #nickRow span{font-size:12px;opacity:.75;}
  #nickIn{font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);
    background:var(--foam);border:2px solid var(--ink);border-radius:999px;
    padding:6px 12px;width:135px;outline:none;}
  #board{align-items:center;justify-content:flex-start;gap:8px;padding:20px 16px;}
  #board h2{font-size:24px;}
  #boardKind{font-size:11.5px;opacity:.7;text-align:center;}
  #boardList{flex:1;width:100%;overflow-y:auto;display:flex;flex-direction:column;gap:5px;margin:4px 0;}
  .brow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;
    background:rgba(234,249,255,.09);border:2px solid rgba(234,249,255,.16);font-size:13.5px;}
  .brow b{width:22px;opacity:.65;font-size:12px;}
  .brow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .brow i{font-style:normal;font-weight:700;color:var(--gold);}
  .brow.me{border-color:var(--gold);}
  #menu .mini{min-width:0;}
  #pause{align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;}
  #pause h2{margin:0;font-size:27px;font-weight:700;}
  #pause p{margin:0;font-size:14px;opacity:.85;max-width:26ch;line-height:1.35;}
  #unlock{align-items:center;justify-content:center;padding:0;background:rgba(6,20,38,.94);}
  #conf{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  #uBody{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
    gap:7px;text-align:center;padding:20px;max-width:100%;}
  #uKicker{font-size:12px;letter-spacing:3px;font-weight:600;color:var(--gold);}
  #uBody h2{margin:0;font-size:26px;font-weight:700;}
  #uGoal{font-size:12.5px;opacity:.72;}
  #uPrev{width:220px;height:93px;}
  #uParts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  #uParts span{font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;
    background:rgba(234,249,255,.14);border:1.5px solid rgba(234,249,255,.3);}
  #uDesc{font-size:13px;opacity:.85;max-width:28ch;line-height:1.35;}
  #over{align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;line-height:1.35;}
  #over h2{margin:0;font-size:27px;font-weight:700;}
  #over p{margin:0;font-size:15px;opacity:.88;}
  button{font-family:inherit;font-size:15px;font-weight:600;color:var(--ink);background:var(--foam);
    border:3px solid var(--ink);border-radius:999px;padding:10px 22px;cursor:pointer;
    box-shadow:0 5px 0 rgba(15,23,36,.55);transition:transform .08s ease, box-shadow .08s ease;}
  button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(15,23,36,.55);}
  button:disabled{opacity:.45;box-shadow:none;cursor:default;}
  button:focus-visible{outline:3px solid var(--coral);outline-offset:3px;}
  .mini{font-size:12.5px;font-weight:500;padding:6px 12px;background:rgba(234,249,255,.14);
    color:var(--foam);border:2px solid rgba(234,249,255,.35);box-shadow:none;}
  .mini:active{transform:translateY(2px);box-shadow:none;}
  #tools{width:100%;max-width:520px;display:flex;justify-content:center;align-items:center;gap:6px;padding:0 4px;flex-wrap:wrap;}
  .pw{font-size:13px;padding:7px 11px;border-radius:12px;display:flex;align-items:center;gap:5px;}
  .pw .cnt{font-size:11px;opacity:.8;}
  .pw.armed{background:var(--gold);color:var(--ink);border-color:var(--ink);}
  /* shop */
  #shop{padding:0;}
  .shopHead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px;}
  .shopHead h3{margin:0;font-size:19px;}
  .tabs{display:flex;gap:6px;padding:0 12px 8px;flex-wrap:wrap;}
  .tab{font-size:12.5px;padding:6px 12px;border-radius:999px;background:rgba(234,249,255,.12);
    border:2px solid rgba(234,249,255,.28);color:var(--foam);box-shadow:none;}
  .tab.on{background:var(--foam);color:var(--ink);border-color:var(--ink);}
  #grid{flex:1;overflow-y:auto;padding:4px 12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .card{background:rgba(234,249,255,.09);border:2px solid rgba(234,249,255,.22);border-radius:14px;
    padding:9px;display:flex;flex-direction:column;gap:6px;line-height:1.25;}
  .card .t{font-size:13.5px;font-weight:600;}
  .card .d{font-size:11px;opacity:.72;min-height:26px;}
  .card .sw{height:26px;border-radius:8px;border:2px solid rgba(15,23,36,.5);display:flex;overflow:hidden;}
  .card .sw i{flex:1;}
  .card button{width:100%;padding:7px 8px;font-size:12.5px;box-shadow:0 3px 0 rgba(15,23,36,.5);}
  .card.eq{border-color:var(--gold);}
  .price{color:var(--gold);font-weight:600;}
  #hint{font-size:12px;opacity:.7;text-align:center;width:100%;}
  @media (prefers-reduced-motion: reduce){ button{transition:none;} }
</style>
</head>
<body>

<div id="hud">
  <div class="box"><span class="n" id="score">0</span><span class="l">punti</span></div>
  <div class="box small" id="coins"><span class="n">0</span><span class="l">monete</span></div>
  <div class="box small" id="lvlBox"><span class="n" id="lvlN">Lv 1</span><div id="xpbar"><i></i></div></div>
  <div id="nextWrap"><span class="l">next</span><canvas id="nextCv" width="72" height="72"></canvas></div>
</div>

<div id="stage">
  <canvas id="c"></canvas>

  <div class="panel" id="over">
    <h2>Vasca piena!</h2>
    <p id="overText"></p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
      <button id="again">Gioca ancora</button>
      <button class="mini" id="shopFromOver">Negozio</button>
      <button class="mini" id="overMenu">Menu</button>
      <button class="mini" id="overBoard">🏆</button>
    </div>
  </div>

  <div class="panel" id="menu">
    <div id="mTitle">Palline<br><span>d'Acquario</span></div>
    <div id="mBest">record 0</div>
    <div style="display:flex;flex-direction:column;gap:9px;align-items:center">
      <button id="mPlay">Gioca</button>
      <button id="mResume" style="display:none">Riprendi partita</button>
      <div id="nickRow">
        <span>Nickname</span>
        <input id="nickIn" maxlength="16" placeholder="il tuo nome" autocomplete="off">
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
        <button class="mini" id="mBoard">🏆 Record</button>
        <button class="mini" id="mShop">🛒 Negozio</button>
        <button class="mini" id="mAudio">⚙ Audio</button>
      </div>
    </div>
  </div>

  <div class="panel" id="board">
    <h2 style="margin:0">🏆 Record</h2>
    <div id="boardKind"></div>
    <div id="boardList"></div>
    <button class="mini" id="boardClose">Chiudi</button>
  </div>

  <div class="panel" id="pause">
    <h2>Pausa</h2>
    <div id="pauseBest">record 0</div>
    <p id="pauseTxt">La partita resta com'e', anche se chiudi. Il negozio si apre a fine partita.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
      <button id="resume">Riprendi</button>
      <button class="mini" id="shopFromPause">⚙ Audio</button>
      <button class="mini" id="quitBtn">Abbandona</button>
    </div>
  </div>

  <div class="panel" id="unlock">
    <canvas id="conf"></canvas>
    <div id="uBody">
      <div id="uKicker">COMPLETATO</div>
      <h2 id="uName"></h2>
      <div id="uGoal"></div>
      <canvas id="uPrev" width="260" height="110"></canvas>
      <div id="uParts"></div>
      <div id="uDesc"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px">
        <button id="uNow">Prova subito</button>
        <button class="mini" id="uLater">Dopo</button>
      </div>
    </div>
  </div>

  <div class="panel" id="shop">
    <div class="shopHead">
      <h3>Negozio</h3>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="price" id="shopCoins">0 monete</span>
        <button class="mini" id="closeShop">Chiudi</button>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div id="grid"></div>
  </div>
</div>

<div id="tools">
  <button class="mini pw" id="pw-hammer">🔨 Martello <span class="cnt" id="c-hammer">0</span></button>
  <button class="mini pw" id="pw-eater">👄 Divora <span class="cnt" id="c-eater">0</span></button>
  <button class="mini pw" id="pw-regress">🌀 Regressa <span class="cnt" id="c-regress">0</span></button>
  <button class="mini pw" id="pw-equal">⚖️ Equal <span class="cnt" id="c-equal">0</span></button>
  <button class="mini pw" id="pw-mini">🔬 Mini <span class="cnt" id="c-mini">0</span></button>
  <button class="mini pw" id="pw-jolly">🃏 Jolly</button>
  <button class="mini pw" id="pw-shake">📳 Shake <span class="cnt" id="c-shake">0</span></button>
  <button class="mini" id="pauseBtn">⏸</button>
  <button class="mini" id="audioBtn">⚙</button>
  <button class="mini" id="openShop">🛒</button>
  <button class="mini" id="muteBtn">🔊</button>
</div>
<div id="hint">Trascina in alto e lascia per far cadere</div>

function levelOf(xp){ let l=1, need=200; while(xp >= need){ xp -= need; l++; need = 200 + (l-1)*90; } return {l:l, cur:xp, need:need}; }
function refreshLevel(){
  const L = levelOf(save.xp);
  const n = document.getElementById('lvlN');
  if(n) n.textContent = 'Lv ' + L.l;
  const bar = document.querySelector('#xpbar i');
  if(bar) bar.style.width = Math.round(L.cur/L.need*100) + '%';
  return L;
}
function addXp(n){
  const before = levelOf(save.xp).l;
  const gain = dailyDouble() ? n*2 : n;
  save.xp += gain;
  if(save.day) save.day.c.xp += gain;
  persist();
  const after = refreshLevel().l;
  if(after > before){ addCoins(after*10); say('Level up'); callout('LEVEL ' + after, W/2, H*.42); sfxLevel(); }
}
function dstr(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function today(){ return dstr(new Date()); }
function yesterday(){ return dstr(new Date(Date.now() - 86400000)); }

function rollDaily(){
  const t = today();
  if(save.day && save.day.date === t) return false;
  const pool = DAILY_POOL.slice(), picks = [];
  while(picks.length < 3 && pool.length) picks.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0].id);
  save.day = {
    date:t, picks:picks, claimed:[], allDone:false,
    rerolled:false,
    c:{ merges:0, games:0, powers:0, coins:0, xp:0, bigMerges:0 },
    b:{ merges:0, score:0, clean:0, tier:0, combo:0 }
  };
  persist();
  return true;
}
const dailyDouble = () => !!(save.day && save.day.allDone);

// una sola volta al giorno: ripesca le quest non ancora completate
function rerollDaily(){
  const d = save.day;
  if(!d || d.rerolled) return false;
  const pool = DAILY_POOL.filter(m => d.picks.indexOf(m.id) < 0);
  const fresh = [];
  for(const id of d.picks){
    if(d.claimed.indexOf(id) >= 0 || !pool.length){ fresh.push(id); continue; }
    fresh.push(pool.splice(Math.floor(Math.random()*pool.length), 1)[0].id);
  }
  d.picks = fresh;
  d.rerolled = true;
  persist();
  return true;
}

let run = { merges:0, tier:0, combo:0, usedPower:false };

function checkGoals(){
  rollDaily();
  const d = save.day, b = d.b;
  b.merges = Math.max(b.merges, run.merges);
  b.score  = Math.max(b.score, score);
  b.clean  = Math.max(b.clean, run.usedPower ? 0 : score);
  b.tier   = Math.max(b.tier, run.tier);
  b.combo  = Math.max(b.combo, run.combo);

  for(const id of d.picks){
    if(d.claimed.indexOf(id) >= 0) continue;
    const m = DAILY_POOL.find(x => x.id === id);
    if(!m || m.get(d.c, b) < m.goal) continue;
    d.claimed.push(id);
    addCoins(m.coins, true);
    sfxBuy(); callout('DAILY!', W/2, H*.34); say('Daily done');
  }
  if(!d.allDone && d.claimed.length >= d.picks.length){
    d.allDone = true;
    save.streak = (save.lastAllDone === yesterday()) ? (save.streak||0) + 1 : 1;
    save.lastAllDone = d.date;
    callout('DOUBLE XP', W/2, H*.40); say('Double experience'); sfxLevel();
  }
  persist();
  checkSecrets();
}

let lastSaid = 0;
function say(txt){
  if(save.muted) return;
  if(!('speechSynthesis' in window)) return;
  const now = performance.now();
  if(now - lastSaid < 450) return;
  lastSaid = now;
  try{
    if(save.voice === 'off' || save.vol.voice <= 0) return;
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'en-US';
    if(save.voice === 'm'){ u.rate = .96; u.pitch = .65; }
    else { u.rate = 1.1; u.pitch = 1.3; }
    u.volume = save.vol.voice;
    const vs = window.speechSynthesis.getVoices() || [];
    const want = save.voice === 'm' ? /male|david|daniel|fred|alex|george/i : /female|samantha|victoria|karen|zira|susan/i;
    const pickv = vs.find(v => /^en/i.test(v.lang) && want.test(v.name) && !(save.voice==='m' && /female/i.test(v.name)));
    if(pickv) u.voice = pickv;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}

const A = { ctx:null, master:null, mus:null, sfx:null, timer:null, step:0, drone:null, theme:null };

function audioInit(){
  if(A.ctx) return;
  try{
    A.ctx = new (window.AudioContext || window.webkitAudioContext)();
    A.master = A.ctx.createGain(); A.master.gain.value = save.muted ? 0 : 1;
    A.master.connect(A.ctx.destination);
    A.mus = A.ctx.createGain(); A.mus.gain.value = .11 * save.vol.mus; A.mus.connect(A.master);
    A.sfx = A.ctx.createGain(); A.sfx.gain.value = .22 * save.vol.sfx; A.sfx.connect(A.master);
    startMusic(save.equip.music);
  }catch(e){}
}
function applyVols(){
  if(!A.ctx) return;
  A.mus.gain.value = .11 * save.vol.mus;
  A.sfx.gain.value = .22 * save.vol.sfx;
}
function tone(dest, freq, dur, type, vol, atk){
  if(!A.ctx) return;
  const t = A.ctx.currentTime;
  const o = A.ctx.createOscillator(), g = A.ctx.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(.001, vol), t + (atk||.012));
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(dest);
  o.start(t); o.stop(t + dur + .05);
  return o;
}
function noise(dur, vol, freq, dest, ftype){
  if(!A.ctx) return;
  const n = Math.max(1, Math.floor(A.ctx.sampleRate * dur));
  const buf = A.ctx.createBuffer(1, n, A.ctx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const s = A.ctx.createBufferSource(); s.buffer = buf;
  const f = A.ctx.createBiquadFilter(); f.type = ftype || 'lowpass'; f.frequency.value = freq || 900;
  const g = A.ctx.createGain(); g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(dest || A.mus);
  s.start();
}
function sweep(dest, f0, f1, dur, type, vol, atk){
  if(!A.ctx) return;
  const t = A.ctx.currentTime;
  const o = A.ctx.createOscillator(), g = A.ctx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(.001, vol), t + (atk || .012));
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + .05);
  return o;
}
function bell(f, dur, vol){
  tone(A.sfx, f, dur, 'sine', vol, .006);
  tone(A.sfx, f*2.76, dur*.55, 'sine', vol*.35, .004);
}
function clank(tier){
  noise(.07, .20, 3200, A.sfx, 'bandpass');
  tone(A.sfx, 190 + tier*12, .13, 'square', .16, .003);
  setTimeout(()=>tone(A.sfx, 260 + tier*16, .09, 'square', .09, .003), 45);
}
function glassHit(tier){
  tone(A.sfx, 1180 + tier*70, .5, 'triangle', .22, .004);
  tone(A.sfx, 1770 + tier*95, .32, 'sine', .12, .004);
}
const PENTA = [0,3,5,7,10,12,15];
const midi = n => 440 * Math.pow(2, (n-69)/12);

function stopMusic(){
  if(A.timer){ clearInterval(A.timer); A.timer = null; }
  if(A.drone){ try{ A.drone.forEach(o=>o.stop()); }catch(e){} A.drone = null; }
}
function startMusic(theme){
  if(!A.ctx) return;
  stopMusic();
  A.theme = theme; A.step = 0;
  let ms = 1200;
  if(theme==='onde') ms = 1250;
  if(theme==='pioggia') ms = 900;
  if(theme==='ritmo') ms = 300;
  if(theme==='horror') ms = 1500;
  if(theme==='retro') ms = 240;
  if(theme==='carillon') ms = 620;
  if(theme==='epico') ms = 420;
  if(theme==='lounge') ms = 380;
  if(theme==='blocchi') ms = 1150;
  if(theme==='ninja') ms = 400;
  if(theme==='feed') ms = 340;
  if(theme==='savana') ms = 380;
  if(theme==='stadio') ms = 450;
  if(theme==='zucchero') ms = 500;

  if(theme==='horror'){
    const o1 = tone(A.mus, 47, 9999, 'sawtooth', .05, 2.5);
    const o2 = tone(A.mus, 48.6, 9999, 'sine', .045, 3);
    A.drone = [o1,o2].filter(Boolean);
  }
  A.timer = setInterval(() => { try{ tick(theme); }catch(e){} }, ms);
}
function tick(theme){
  const s = A.step++;
  if(theme==='onde'){
    const n = 57 + PENTA[Math.floor(Math.random()*PENTA.length)];
    tone(A.mus, midi(n), 2.6, 'sine', .28, .5);
    if(s % 4 === 0){ tone(A.mus, midi(33), 5, 'sine', .22, 1.2); tone(A.mus, midi(40), 5, 'sine', .14, 1.4); }
  }
  else if(theme==='pioggia'){
    if(Math.random() < .75){
      const n = 62 + PENTA[Math.floor(Math.random()*5)];
      tone(A.mus, midi(n), 1.6, 'triangle', .22, .25);
    }
    if(s % 8 === 0) tone(A.mus, midi(38), 4.5, 'sine', .2, 1);
    if(s % 3 === 0) noise(.25, .05, 1800);
  }
  else if(theme==='ritmo'){
    const bass = [36,36,43,36,41,36,38,36];
    if(s % 2 === 0) tone(A.mus, midi(bass[(s/2)%8]), .3, 'square', .22, .01);
    if(s % 8 === 0) noise(.14, .22, 160);
    if(s % 8 === 4) noise(.09, .10, 4200);
    const lead = [60,64,67,72,67,64,62,64];
    if(s % 2 === 1) tone(A.mus, midi(lead[Math.floor(s/2)%8]), .22, 'triangle', .13, .01);
  }
  else if(theme==='horror'){
    if(Math.random() < .55){
      const n = 72 + [0,1,6,11,13][Math.floor(Math.random()*5)];
      tone(A.mus, midi(n), 2.2, 'sine', .12, .8);
    }
    if(s % 6 === 3) noise(1.2, .05, 400);

const NV = 16;                       // punti del contorno molle
const ZERO = new Float32Array(NV);
function shapePath(r, offs, t, seed){
  ctx.beginPath();
  const o = offs || ZERO;
  const pts = [];
  for(let i=0;i<NV;i++){
    const a = i/NV*Math.PI*2;
    const idle = Math.sin(t/620 + seed + i*1.9) * r*.009 + Math.sin(t/310 + seed*2 + i) * r*.005;
    const rr = r + o[i] + idle;
    pts.push([Math.cos(a)*rr, Math.sin(a)*rr]);
  }
  ctx.moveTo((pts[NV-1][0]+pts[0][0])/2, (pts[NV-1][1]+pts[0][1])/2);
  for(let i=0;i<NV;i++){
    const c = pts[i], n = pts[(i+1)%NV];
    ctx.quadraticCurveTo(c[0], c[1], (c[0]+n[0])/2, (c[1]+n[1])/2);
  }
  ctx.closePath();
}
function stepVerts(p, dt, r){
  const f = Math.min(2.2, dt/16.67);
  const o = p.vo, v = p.vv;
  const lim = r*.34;
  for(let i=0;i<NV;i++){
    const prev = o[(i+NV-1)%NV], next = o[(i+1)%NV];
    v[i] += (-(o[i] - p.vt[i])*.34 + ((prev+next)/2 - o[i])*.06) * f;  // tiene la conca, leviga appena
    v[i] *= Math.pow(.80, f);                                          // si ferma in fretta
    o[i] += v[i]*f;
    if(o[i] > lim){ o[i] = lim; v[i] *= .4; }
    if(o[i] < -lim){ o[i] = -lim; v[i] *= .4; }
  }
}
function poke(b, nx, ny, amp){
  const p = b.plugin, r = R(p.tier);
  const ang = Math.atan2(ny, nx) - b.angle;      // l ammaccatura resta sul punto colpito
  for(let i=0;i<NV;i++){
    const d = Math.cos(i/NV*Math.PI*2 - ang);
    if(d > 0) p.vv[i] -= amp * r * d * d * .16;
  }
}

function makeBall(x, y, tier, special, lv){
  lv = lv || 1;

    restitution:.07, friction:.16, frictionStatic:.34,
    frictionAir: .0075 / (1 + .55*(lv-1)),        // i gradi alti fendono l aria
    density:.001 * (1.30 - tier*.048) * (1 + .65*(lv-1)),   // piu' grande = meno densa; piu' grado = piu' densa
    slop:.02, label:'ball'
  }, 26);
  b.plugin = {
    isBall:true, tier:tier, lv:lv, dead:false, landed:false, born:performance.now(),
    special:special||null, hits:0,
    pop:0, load:0, sq:0, ax:0, ay:1,
    wob:0, wobT:999, wax:0, way:1, dk:0, dax:0, day:1,
    vo:new Float32Array(NV), vv:new Float32Array(NV), vt:new Float32Array(NV),
    hard:(1.30 - tier*.048) * Math.pow(lv, 1.8),   // un grado piu' alto e' molto piu' duro
    seed:Math.random()*9
  };
  if(lv > maxLv[tier]) maxLv[tier] = lv;   // da ora quella misura esce sempre cosi'
  Composite.add(engine.world, b);
  return b;
}

Events.on(engine, 'collisionActive', ev => {
  for(const p of ev.pairs){
    const a = p.bodyA, b = p.bodyB;
    if(a.plugin && a.plugin.isBall && b.plugin && b.plugin.isBall
       && !a.plugin.swal && !b.plugin.swal){
      contacts.push({a:a, b:b, n:p.collision.normal});
    }
  }
});

Events.on(engine, 'collisionStart', ev => {
  for(const p of ev.pairs){
    const a = p.bodyA, b = p.bodyB;
    const ab = a.plugin && a.plugin.isBall, bb = b.plugin && b.plugin.isBall;
    if((ab && a.plugin.swal) || (bb && b.plugin.swal)) continue;
    if(ab) a.plugin.landed = true;
    if(bb) b.plugin.landed = true;

    // urto: la pallina entra in oscillazione elastica lungo la normale
    const rel = Math.hypot(a.velocity.x - b.velocity.x, a.velocity.y - b.velocity.y);
    const amp = Math.min(.34, rel * .040);
    const n = p.collision.normal;
    if(ab && amp > .01){
      a.plugin.wob = Math.max(a.plugin.wob * .5, amp*.6); a.plugin.wobT = 0;
      a.plugin.wax = -n.x; a.plugin.way = -n.y;
      poke(a, n.x, n.y, Math.min(2.2, rel*.30));
    }
    if(bb && amp > .01){
      b.plugin.wob = Math.max(b.plugin.wob * .5, amp*.6); b.plugin.wobT = 0;
      b.plugin.wax = n.x; b.plugin.way = n.y;
      poke(b, -n.x, -n.y, Math.min(2.2, rel*.30));
    }

    if(!ab || !bb || a.plugin.dead || b.plugin.dead) continue;

    const ja = a.plugin.special === 'jolly', jb = b.plugin.special === 'jolly';
    if(ja || jb){ doJolly(ja ? a : b, ja ? b : a); continue; }

    // pallina Regressa
    const sa = a.plugin.special === 'regress', sb = b.plugin.special === 'regress';
    if(sa !== sb){
      const sp = sa ? a : b, oth = sa ? b : a;
      doRegress(sp, oth);
      continue;
    }
    if(sa && sb) continue;

    // abilita Divora
    if(performance.now() < eaterUntil){
      const diff = power(a.plugin) - power(b.plugin);
      if(Math.abs(diff) >= 3){
        const big = diff > 0 ? a : b, small = diff > 0 ? b : a;
        small.plugin.dead = true;
        Composite.remove(engine.world, small);
        pops.push({x:small.position.x, y:small.position.y, r:R(small.plugin.tier), t:0});
        addScore((small.plugin.tier+1)*3*small.plugin.lv);
        big.plugin.wob = .2; big.plugin.wobT = 0;
        sfxChew();
        continue;
      }
    }

    if(a.plugin.tier === b.plugin.tier && a.plugin.lv !== b.plugin.lv){
      const hi = a.plugin.lv > b.plugin.lv ? a : b;
      vaporize(hi, hi === a ? b : a);
      continue;
    }
    if(a.plugin.tier !== b.plugin.tier || a.plugin.lv !== b.plugin.lv){
      const now2 = performance.now();
      const af = now2 - a.plugin.born < 1200, bf = now2 - b.plugin.born < 1200;
      if(af && !bf) impactNudge(a, b);
      else if(bf && !af) impactNudge(b, a);
      continue;
    }
    merge(a, b);
  }
});

// spinta realistica: conta dove la colpisci, non solo che la colpisci
function impactNudge(dropper, other){
  const rel = Math.hypot(dropper.velocity.x, dropper.velocity.y);
  if(rel < .8) return;
  const dx = other.position.x - dropper.position.x;
  const dy = other.position.y - dropper.position.y;
  const len = Math.hypot(dx, dy) || 1;
  const nx = dx/len, ny = dy/len;                 // direzione del colpo
  const ratio = dropper.mass / other.mass;
  const k = Math.min(1.5, rel * ratio * .22);
  // quanto e' decentrato il colpo: 0 in pieno, 1 di striscio
  const off = Math.abs(nx);
  Body.setVelocity(other, {
    x: other.velocity.x + nx * k,
    y: other.velocity.y + ny * k * .45
  });
  Body.setAngularVelocity(other, other.angularVelocity + nx * k * .055);
  // contraccolpo su chi ha lanciato
  Body.setVelocity(dropper, {
    x: dropper.velocity.x - nx * k * .30 / Math.max(.35, ratio),
    y: dropper.velocity.y * (.72 + off*.2)
  });
  Body.setAngularVelocity(dropper, dropper.angularVelocity - nx * k * .04);
}

const swallowed = [];

function swallow(host, victim){
  if(victim.plugin.dead || victim.plugin.swal || victim === host) return;
  victim.plugin.swal = { host:host, t:0, dur: 420 + Math.random()*260 };
  victim.isSensor = true;
  Body.setVelocity(victim, {x:0, y:0});
  Body.setAngularVelocity(victim, (Math.random()-.5)*.25);
  swallowed.push(victim);
  audioInit();
  if(A.ctx) sweep(A.sfx, 420, 180, .22, 'sine', .12, .02);
}

function spitOut(v){
  const sw = v.plugin.swal;
  if(!sw) return;
  const host = sw.host;
  const hx = host && !host.plugin.dead ? host.position.x : v.position.x;
  const hy = host && !host.plugin.dead ? host.position.y : v.position.y;
  let dx = v.position.x - hx, dy = v.position.y - hy;
  let len = Math.hypot(dx, dy);
  if(len < 1){                                    // al centro: direzione a caso
    const a = Math.random()*Math.PI*2;
    dx = Math.cos(a); dy = Math.sin(a); len = 1;
  }
  dx /= len; dy /= len;
  // esce dal punto piu' vicino del bordo
  const out = (host && !host.plugin.dead ? R(host.plugin.tier) : 0) + R(v.plugin.tier) + 2;
  Body.setPosition(v, { x: Math.max(10, Math.min(W-10, hx + dx*out)),
                        y: Math.max(10, Math.min(H-10, hy + dy*out)) });
  const sp = 5 + Math.random()*4;
  const spread = (Math.random()-.5)*.9;
  const ca = Math.cos(spread), sa = Math.sin(spread);
  Body.setVelocity(v, { x: (dx*ca - dy*sa)*sp, y: (dx*sa + dy*ca)*sp - 1.5 });
  Body.setAngularVelocity(v, (Math.random()-.5)*.5);
  v.isSensor = false;
  v.plugin.swal = null;
  v.plugin.wob = .26; v.plugin.wobT = 0;
  const i = swallowed.indexOf(v);
  if(i >= 0) swallowed.splice(i, 1);
  pops.push({x:v.position.x, y:v.position.y, r:R(v.plugin.tier)*.9, t:0});
  burst(v.position.x, v.position.y, 7, R(v.plugin.tier)*.12, 420, R(v.plugin.tier)*.09,
        ['#ffffff', (SKINS[save.equip.skin]||SKINS.acquario).cols[v.plugin.tier]], 'dot', .0012);
  audioInit();
  if(A.ctx){ sweep(A.sfx, 260, 760, .12, 'sine', .18, .004); noise(.06,.10,3200,A.sfx,'highpass'); }
}

function stepSwallowed(dt){
  for(let i=swallowed.length-1;i>=0;i--){
    const v = swallowed[i];
    const sw = v.plugin.swal;
    if(!sw || v.plugin.dead){ swallowed.splice(i,1); continue; }
    const host = sw.host;
    if(!host || host.plugin.dead){ spitOut(v); continue; }
    sw.t += dt;
    // scivola piano verso il centro di chi l ha inghiottita
    const k = Math.min(1, dt/260);
    Body.setPosition(v, {
      x: v.position.x + (host.position.x - v.position.x) * k * .55,
      y: v.position.y + (host.position.y - v.position.y) * k * .55
    });
    Body.setVelocity(v, {x:0, y:0});
    if(sw.t >= sw.dur) spitOut(v);
  }
}

function merge(a, b){
  const tier = a.plugin.tier, lv = a.plugin.lv;
  const mx = (a.position.x+b.position.x)/2, my = (a.position.y+b.position.y)/2;
  a.plugin.dead = true; b.plugin.dead = true;
  Composite.remove(engine.world, a); Composite.remove(engine.world, b);
  pops.push({x:mx, y:my, r:R(tier), t:0});
  fxMerge(mx, my, R(tier), tier);
  sfxMerge(tier);
  addCoins((tier + 1) * lv);
  addXp((tier+1) * 2 * lv);
  save.st.merges++;
  if(tier+1 > save.st.maxTier) save.st.maxTier = tier+1;
  run.merges++;
  if(tier+1 > run.tier) run.tier = tier+1;
  if(save.day){ save.day.c.merges++; if(tier >= 5) save.day.c.bigMerges++; }

  const now = performance.now();
  combo = (now - lastMerge < 950) ? combo + 1 : 1;
  lastMerge = now;
  if(combo > run.combo) run.combo = combo;
  if(combo >= 5 && !jollyStored && Math.random() < .20){
    jollyStored = true;
    callout('JOLLY!', mx, my - R(tier) - 26);
    say('Joker');
    sfxJolly();
    refreshPowers();
  }

  if(tier === MAXT){
    // due palline massime: si riparte dal primo stadio, ma di livello superiore
    addScore(300 * lv);
    const nb = makeBall(mx, my, 0, null, lv + 1);
    nb.plugin.landed = true; nb.plugin.pop = 1;
    Body.setVelocity(nb, {x:0, y:-2});
    if(watched === a || watched === b){ watched = null; watchRest = 0; }   // fusa: nessuna sconfitta
    shake = 14;
    callout('LIVELLO ' + (lv+1) + '!', mx, my - R(tier));
    say('Ascension. Level ' + (lv+1));
    sfxAscend(lv+1);
    checkGoals();
    return;
  }

  const res = tier + 2;
  if(PRAISE[res]){ callout(PRAISE[res], mx, my - R(tier)); say(PRAISE[res].replace('!','')); }
  else if(combo >= 3){ callout('COMBO x'+combo, mx, my - R(tier)); say('Combo'); }
  if(combo >= 3) addScore(combo * 5 * lv);
  if(res >= 8) shake = Math.min(11, 4 + res);

  const nb = makeBall(mx, my, tier+1, null, lv);
  nb.plugin.landed = true; nb.plugin.pop = 1;
  // le palline rimaste nella zona della fusione vengono inghiottite
  const rn = R(tier+1);
  for(const o of Composite.allBodies(engine.world)){
    const op = o.plugin;
    if(!op || !op.isBall || op.dead || op.swal || o === nb) continue;
    if(Math.hypot(o.position.x - mx, o.position.y - my) < rn * .92) swallow(nb, o);
  }
  Body.setVelocity(nb, {x:0, y:-1.4});
  if(watched === a || watched === b){ watched = null; watchRest = 0; }     // fusa: nessuna sconfitta
  addScore((tier+1)*(tier+2) * lv);
  checkGoals();
}

// il Jolly prende l'identita' di cio' che tocca e si fonde con qualsiasi cosa
// stessa misura ma aura piu' alta: la inferiore evapora
function vaporize(hi, lo){
  if(lo.plugin.dead || hi.plugin.dead) return;
  const t = lo.plugin.tier, pos = {x:lo.position.x, y:lo.position.y};
  lo.plugin.dead = true;
  Composite.remove(engine.world, lo);
  pops.push({x:pos.x, y:pos.y, r:R(t), t:0});
  pops.push({x:pos.x, y:pos.y, r:R(t)*.55, t:0});
  burst(pos.x, pos.y, 12, R(t)*.12, 620, R(t)*.09, ['#ffffff', lvColor(Math.max(2,hi.plugin.lv))], 'spark', -.0002);
  hi.plugin.wob = Math.max(hi.plugin.wob, .18); hi.plugin.wobT = 0;
  addScore((t+1) * 4 * hi.plugin.lv);
  addCoins(1);
  sfxVapor();
  if(watched === lo){ watched = null; watchRest = 0; }
}

function doJolly(j, o){
  if(j.plugin.dead || o.plugin.dead) return;
  if(o.plugin.special === 'jolly'){
    o.plugin.special = null; o.plugin.tier = 3; o.plugin.lv = 1;
    j.plugin.special = null; j.plugin.tier = 3; j.plugin.lv = 1;
  } else {
    j.plugin.special = null;
    j.plugin.tier = o.plugin.tier;
    j.plugin.lv = o.plugin.lv;
  }
  merge(j, o);
}

function doRegress(sp, oth){
  if(oth.plugin.dead) return;
  const t = oth.plugin.tier, lvv = oth.plugin.lv;
  const pos = {x:oth.position.x, y:oth.position.y};
  oth.plugin.dead = true;
  Composite.remove(engine.world, oth);
  pops.push({x:pos.x, y:pos.y, r:R(t), t:0});
  if(t > 0){
    const nb = makeBall(pos.x, pos.y, t-1, null, lvv);
    nb.plugin.landed = true; nb.plugin.pop = .8;
  }
  sfxWarpHit();
  sp.plugin.hits++;
  if(sp.plugin.hits >= 3){
    sp.plugin.dead = true;
    Composite.remove(engine.world, sp);
    pops.push({x:sp.position.x, y:sp.position.y, r:R(sp.plugin.tier), t:0});
  }
}

/* ---- CARICO: quanto peso grava davvero dall'alto ---- */
function computeLoad(bodies){
  const balls = bodies.filter(b => b.plugin && b.plugin.isBall);
  for(const b of balls){ b.plugin._carry = b.mass; b.plugin._sup = []; b.plugin._above = null; }

  for(const c of contacts){
    if(c.a.plugin.dead || c.b.plugin.dead) continue;
    const upper = c.a.position.y < c.b.position.y ? c.a : c.b;
    const lower = upper === c.a ? c.b : c.a;
    const ny = Math.abs(c.n.y);
    if(ny < .30) continue;                       // contatto laterale: non regge peso
    const dx = lower.position.x - upper.position.x;
    const dy = lower.position.y - upper.position.y;
    const len = Math.hypot(dx,dy) || 1;
    lower.plugin._sup.push({ up:upper, w:ny, dx:dx/len, dy:dy/len });
  }

  // dall'alto verso il basso: ogni pallina scarica il peso che porta su chi la regge
  balls.sort((p,q) => p.position.y - q.position.y);
  const supportedBy = new Map();           // pallina sopra -> chi la sostiene
  for(const b of balls){
    for(const s of b.plugin._sup){
      if(!supportedBy.has(s.up.id)) supportedBy.set(s.up.id, []);
      supportedBy.get(s.up.id).push({ lower:b, w:s.w });
    }
  }
  for(const b of balls){
    const list = supportedBy.get(b.id);
    if(!list || !list.length) continue;
    const tot = list.reduce((s,x)=>s+x.w, 0) || 1;
    for(const x of list) x.lower.plugin._carry += b.plugin._carry * (x.w/tot);
  }

  for(const b of balls){
    const above = b.plugin._carry - b.mass;          // peso che regge, esclusa se stessa
    const ratio = above / b.mass;
    const sp = Math.hypot(b.velocity.x, b.velocity.y);
    let k = Math.min(.12, ratio * .035);
    if(sp > 2.5) k *= .35;                            // se sta ancora rotolando, si schiaccia poco
    b.plugin.load = k;
    // direzione media di chi la preme
    let ax = 0, ay = 0;
    for(const s of b.plugin._sup){ ax -= s.dx * s.w; ay -= s.dy * s.w; }
    const l = Math.hypot(ax, ay);
    if(l > .001){ b.plugin.ax = ax/l; b.plugin.ay = ay/l; }
    else { b.plugin.ax = 0; b.plugin.ay = -1; }
  }
}

/* ============================ FACCE ============================ */

function INK(){ return skin().ink; }
function eyeWhite(x,y,rx,ry,r){
  ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
  ctx.fillStyle='#fff'; ctx.fill();
  ctx.lineWidth=Math.max(1,r*.055); ctx.strokeStyle=INK(); ctx.stroke();
}
function pupil(x,y,rr){ ctx.beginPath(); ctx.arc(x,y,rr,0,Math.PI*2); ctx.fillStyle=INK(); ctx.fill(); }
function arcEye(x,y,w,r,dir){
  ctx.beginPath(); ctx.lineWidth=Math.max(1.4,r*.085); ctx.strokeStyle=INK(); ctx.lineCap='round';
  ctx.moveTo(x-w,y); ctx.quadraticCurveTo(x, y-dir*w*1.15, x+w, y); ctx.stroke();
}
function star(x,y,rr){
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const ang = -Math.PI/2 + i*Math.PI/5, rad = i%2 ? rr*.44 : rr;
    const px = x+Math.cos(ang)*rad, py = y+Math.sin(ang)*rad;
    i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
  }
  ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill();
  ctx.lineWidth=Math.max(1,rr*.16); ctx.strokeStyle=INK(); ctx.stroke();
}
function heart(x,y,s){
  ctx.beginPath(); ctx.moveTo(x, y+s*.85);
  ctx.bezierCurveTo(x-s*1.5, y-s*.25, x-s*.55, y-s*1.15, x, y-s*.35);
  ctx.bezierCurveTo(x+s*.55, y-s*1.15, x+s*1.5, y-s*.25, x, y+s*.85);
  ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill();
  ctx.lineWidth=Math.max(1,s*.28); ctx.strokeStyle=INK(); ctx.stroke();
}
function smile(r,w,depth){
  ctx.beginPath(); ctx.lineWidth=Math.max(1.4,r*.075); ctx.strokeStyle=INK(); ctx.lineCap='round';
  ctx.moveTo(-w, r*.38); ctx.quadraticCurveTo(0, r*.38+depth, w, r*.38); ctx.stroke();
}
function openMouth(r,w,h){ ctx.beginPath(); ctx.ellipse(0, r*.42, w, h, 0, 0, Math.PI*2); ctx.fillStyle=INK(); ctx.fill(); }
function bigGrin(r){
  ctx.beginPath();
  ctx.moveTo(-r*.52, r*.28); ctx.quadraticCurveTo(0, r*.92, r*.52, r*.28);
  ctx.quadraticCurveTo(0, r*.42, -r*.52, r*.28); ctx.closePath();
  ctx.fillStyle=INK(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-r*.30, r*.36); ctx.lineTo(-r*.30, r*.56);
  ctx.moveTo(r*.05, r*.38); ctx.lineTo(r*.05, r*.60);
  ctx.lineWidth=Math.max(1,r*.05); ctx.strokeStyle='#fff'; ctx.stroke();
}
function brow(x,y,w,tilt,r){
  ctx.save(); ctx.translate(x,y); ctx.rotate(tilt);
  ctx.beginPath(); ctx.lineWidth=Math.max(1.5,r*.085); ctx.strokeStyle=INK(); ctx.lineCap='round';
  ctx.moveTo(-w,0); ctx.lineTo(w,0); ctx.stroke(); ctx.restore();
}

function drawFace(kind, r, vx, vy, squashed, bodyCol, style, seed){
  const ex = r*.36, ey = -r*.10;
  // battito di ciglia: ogni quattro secondi circa, sfasato per ogni pallina
  if(squashed <= .12 && (!style || style === 'normal')){
    const ph = ((performance.now() + (seed||0)*1700) % 4300) / 4300;
    if(ph < .035){
      arcEye(-ex, ey+r*.03, r*.22, r, 1); arcEye(ex, ey+r*.03, r*.22, r, 1);
      smile(r, r*.22, r*.20);
      return;
    }
  }
  const lx = Math.max(-1,Math.min(1,vx/6)), ly = Math.max(-1,Math.min(1,vy/6));

  if(squashed > .12){   // schiacciata: occhi strizzati e boccuccia sofferente
    arcEye(-ex, ey, r*.22, r, -1); arcEye(ex, ey, r*.22, r, -1);
    ctx.beginPath(); ctx.lineWidth=Math.max(1.4,r*.08); ctx.strokeStyle=INK(); ctx.lineCap='round';
    ctx.moveTo(-r*.18, r*.44); ctx.quadraticCurveTo(0, r*.30, r*.18, r*.44); ctx.stroke();
    return;
  }

  if(style && style !== 'normal'){
    if(style === 'pixel'){
      const b = r/7;
      ctx.fillStyle='#fff';
      ctx.fillRect(-ex-b, ey-b, b*2, b*2); ctx.fillRect(ex-b, ey-b, b*2, b*2);
      ctx.fillStyle=INK();
      ctx.fillRect(-ex-b*.2, ey-b*.2, b, b); ctx.fillRect(ex-b*.2, ey-b*.2, b, b);
      ctx.fillRect(-b*1.5, r*.40, b, b); ctx.fillRect(-b*.5, r*.55, b*2, b); ctx.fillRect(b*1.5, r*.40, b, b);
    }
    else if(style === 'glow'){
      ctx.save(); ctx.shadowColor='#00e5ff'; ctx.shadowBlur=r*.45;
      ctx.fillStyle='#8ff6ff';
      ctx.beginPath(); ctx.arc(-ex, ey, r*.19, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(ex, ey, r*.19, 0, TAU); ctx.fill();
      ctx.restore();
      ctx.beginPath(); ctx.lineWidth=Math.max(1.4,r*.07); ctx.strokeStyle='rgba(0,229,255,.7)'; ctx.lineCap='round';
      ctx.moveTo(-r*.22, r*.44); ctx.lineTo(r*.22, r*.44); ctx.stroke();
    }
    else if(style === 'gem'){
      for(const s of [-1,1]){
        ctx.beginPath(); ctx.arc(s*ex, ey, r*.20, 0, TAU);
        ctx.fillStyle='#f2fbff'; ctx.fill();
        ctx.lineWidth=Math.max(1.5,r*.07); ctx.strokeStyle='#14140f'; ctx.stroke();
        ctx.beginPath(); ctx.arc(s*ex - r*.06, ey - r*.06, r*.07, 0, TAU);
        ctx.fillStyle='rgba(255,255,255,.9)'; ctx.fill();
      }
    }
    else if(style === 'carved'){
      for(const s of [-1,1]){
        ctx.beginPath(); ctx.ellipse(s*ex, ey, r*.21, r*.13, 0, 0, TAU);
        ctx.fillStyle='rgba(60,45,22,.75)'; ctx.fill();
        ctx.beginPath(); ctx.ellipse(s*ex, ey+r*.045, r*.21, r*.13, 0, Math.PI*.15, Math.PI*.85);
        ctx.lineWidth=Math.max(1,r*.04); ctx.strokeStyle='rgba(255,245,215,.55)'; ctx.stroke();
      }
      ctx.beginPath(); ctx.lineWidth=Math.max(1.4,r*.06); ctx.strokeStyle='rgba(60,45,22,.7)'; ctx.lineCap='round';
      ctx.moveTo(-r*.24, r*.42); ctx.lineTo(r*.24, r*.42); ctx.stroke();
    }
    else if(style === 'goggle'){
      for(const s of [-1,1]){
        eyeWhite(s*ex, ey, r*.21, r*.21, r);
        pupil(s*ex + lx*r*.05, ey + ly*r*.05, r*.11);
        ctx.beginPath(); ctx.arc(s*ex, ey, r*.28, 0, TAU);
        ctx.lineWidth=Math.max(1.6,r*.075); ctx.strokeStyle='#8c6239'; ctx.stroke();
      }
      ctx.beginPath(); ctx.lineWidth=Math.max(1.4,r*.05); ctx.strokeStyle='#8c6239';
      ctx.moveTo(-ex+r*.28, ey); ctx.lineTo(ex-r*.28, ey); ctx.stroke();
      smile(r, r*.20, r*.18);
    }
    else if(style === 'sparkle'){
      for(const s of [-1,1]){
        ctx.save(); ctx.shadowColor='#fff'; ctx.shadowBlur=r*.3;
        ctx.beginPath(); ctx.arc(s*ex, ey, r*.17, 0, TAU);
        ctx.fillStyle='#ffffff'; ctx.fill(); ctx.restore();
        ctx.save(); ctx.translate(s*ex, ey); ctx.strokeStyle='rgba(255,255,255,.8)';
        ctx.lineWidth=Math.max(1,r*.035); ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(-r*.26,0); ctx.lineTo(r*.26,0);
        ctx.moveTo(0,-r*.26); ctx.lineTo(0,r*.26); ctx.stroke(); ctx.restore();
      }
      ctx.beginPath(); ctx.lineWidth=Math.max(1.4,r*.07); ctx.strokeStyle='rgba(255,255,255,.75)'; ctx.lineCap='round';
      ctx.moveTo(-r*.20, r*.40); ctx.quadraticCurveTo(0, r*.58, r*.20, r*.40); ctx.stroke();
    }
    return;
  }

  if(kind==='dots'){
    eyeWhite(-ex,ey,r*.22,r*.26,r); eyeWhite(ex,ey,r*.22,r*.26,r);
    pupil(-ex+lx*r*.06, ey+ly*r*.06, r*.13); pupil(ex+lx*r*.06, ey+ly*r*.06, r*.13);
    smile(r, r*.20, r*.16);
  } else if(kind==='surprised'){
    eyeWhite(-ex,ey,r*.26,r*.30,r); eyeWhite(ex,ey,r*.26,r*.30,r);
    pupil(-ex+lx*r*.07, ey+ly*r*.07, r*.155); pupil(ex+lx*r*.07, ey+ly*r*.07, r*.155);
    openMouth(r, r*.12, r*.17);
  } else if(kind==='happy'){
    arcEye(-ex, ey+r*.04, r*.20, r, 1); arcEye(ex, ey+r*.04, r*.20, r, 1);
    smile(r, r*.24, r*.24);
  } else if(kind==='wink'){
    arcEye(-ex, ey+r*.04, r*.20, r, 1);
    eyeWhite(ex,ey,r*.24,r*.28,r); pupil(ex, ey+r*.03, r*.14);
    smile(r, r*.26, r*.26);
  } else if(kind==='stars'){
    star(-ex, ey, r*.27); star(ex, ey, r*.27); bigGrin(r);
  } else if(kind==='hearts'){
    heart(-ex, ey, r*.24); heart(ex, ey, r*.24); bigGrin(r);
  } else if(kind==='squint'){
    arcEye(-ex, ey, r*.22, r, -1); arcEye(ex, ey, r*.22, r, -1); bigGrin(r);
  } else if(kind==='evil'){
    brow(-ex-r*.02, ey-r*.30, r*.20, .42, r); brow(ex+r*.02, ey-r*.30, r*.20, -.42, r);
    eyeWhite(-ex,ey,r*.23,r*.19,r); eyeWhite(ex,ey,r*.23,r*.19,r);
    pupil(-ex+r*.05, ey, r*.115); pupil(ex-r*.05, ey, r*.115);
    ctx.beginPath();
    ctx.moveTo(-r*.50, r*.26); ctx.quadraticCurveTo(-r*.10, r*.86, r*.54, r*.22);
    ctx.quadraticCurveTo(0, r*.40, -r*.50, r*.26); ctx.closePath();
    ctx.fillStyle=INK(); ctx.fill();
  } else if(kind==='smug'){
    brow(-ex, ey-r*.34, r*.18, -.18, r); brow(ex, ey-r*.36, r*.18, .12, r);
    eyeWhite(-ex,ey,r*.25,r*.29,r); eyeWhite(ex,ey,r*.25,r*.29,r);
    pupil(-ex+lx*r*.05, ey+r*.03, r*.145); pupil(ex+lx*r*.05, ey+r*.03, r*.145);
    ctx.save(); ctx.fillStyle = bodyCol;
    ctx.beginPath(); ctx.ellipse(-ex, ey-r*.24, r*.27, r*.16, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(ex, ey-r*.24, r*.27, r*.16, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    openMouth(r, r*.13, r*.15);
  } else if(kind==='xx'){   // pallina Regressa
    ctx.lineWidth=Math.max(1.6,r*.09); ctx.strokeStyle='#fff'; ctx.lineCap='round';
    for(const s of [-1,1]){
      ctx.beginPath();
      ctx.moveTo(s*ex-r*.16, ey-r*.16); ctx.lineTo(s*ex+r*.16, ey+r*.16);
      ctx.moveTo(s*ex+r*.16, ey-r*.16); ctx.lineTo(s*ex-r*.16, ey+r*.16);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.ellipse(0, r*.42, r*.14, r*.11, 0, 0, Math.PI*2);
    ctx.fillStyle='#fff'; ctx.fill();
  }
}

/* ---- decorazioni delle skin (ricostruite dai set) ---- */

function prng(seed){
  let s = (seed*1103515245 + 12345) % 2147483647;
  return () => { s = (s*1103515245 + 12345) % 2147483647; return Math.abs(s)/2147483647; };
}
function shade(hex, amt){
  const c = hex.replace('#',''), n = parseInt(c,16);
  const r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  const f = x => Math.max(0, Math.min(255, Math.round(amt<0 ? x*(1+amt) : x+(255-x)*amt)));
  return 'rgb('+f(r)+','+f(g)+','+f(b)+')';
}
const TAU = Math.PI*2;

function gear(x,y,rad,c,spin){
  ctx.save(); ctx.translate(x,y); ctx.rotate(spin||0); ctx.fillStyle=c;
  for(let i=0;i<8;i++){ ctx.save(); ctx.rotate(i/8*TAU); ctx.fillRect(-rad*.17,-rad*1.3, rad*.34, rad*.45); ctx.restore(); }
  ctx.beginPath(); ctx.arc(0,0,rad,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(0,0,rad*.36,0,TAU); ctx.fillStyle='rgba(0,0,0,.4)'; ctx.fill();
  ctx.restore();
}

const PAINT = {
  cosmo(r,tier,col){
    const g = ctx.createRadialGradient(-r*.3,-r*.35,r*.08,0,0,r);
    g.addColorStop(0,'rgba(255,255,255,.20)'); g.addColorStop(1,'rgba(0,0,0,.4)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.fill();
    const rr = prng(tier+7), tt = performance.now();
    ctx.save(); ctx.rotate(tt/11000);
    for(let i=0;i<11;i++){
      const a=rr()*TAU, d=rr()*r*.92, ph=rr()*6.28;
      const tw = .3 + .55*Math.abs(Math.sin(tt/420 + ph));
      ctx.beginPath(); ctx.arc(Math.cos(a)*d, Math.sin(a)*d, r*(.025+rr()*.05)*(.75+tw*.5), 0, TAU);
      ctx.fillStyle='rgba(255,255,255,'+tw+')'; ctx.fill();
    }
    ctx.restore();
  },
  pixel(r,tier,col){
    const n=7, bs=r/n;
    const dk=shade(col,-.3), lt=shade(col,.22);
    for(let gy=-n; gy<n; gy++) for(let gx=-n; gx<n; gx++){
      const cx=(gx+.5)*bs, cy=(gy+.5)*bs, d=Math.hypot(cx,cy);
      if(d > r-bs*.15) continue;
      let c = col;
      if(cx+cy > r*.42) c = dk; else if(cx+cy < -r*.55) c = lt;
      if(d > r-bs*1.15) c = INK();
      ctx.fillStyle=c; ctx.fillRect(gx*bs, gy*bs, bs+.7, bs+.7);
    }
    ctx.fillStyle='#4caf50';
    ctx.fillRect(-bs*.5, -r-bs*.9, bs, bs);
    ctx.fillRect(bs*.5, -r-bs*.4, bs, bs);
  },
  steam(r,tier,col){
    const g = ctx.createRadialGradient(-r*.3,-r*.35,r*.08,0,0,r);
    g.addColorStop(0,'rgba(255,240,200,.5)'); g.addColorStop(1,'rgba(40,25,10,.45)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.fill();
    const rr = prng(tier+3);
    const tt = performance.now();
    for(let i=0;i<2;i++){
      const a=rr()*TAU, d=r*(.3+rr()*.35);
      gear(Math.cos(a)*d, Math.sin(a)*d, r*(.2+rr()*.12), shade(col,-.38),
           (i ? -tt/1700 : tt/1300));
    }
    for(let i=0;i<10;i++){
      const a=i/10*TAU;
      const gl = .35 + .45*Math.max(0, Math.sin(tt/700 - i*.63));   // luccichio che gira
      ctx.beginPath(); ctx.arc(Math.cos(a)*r*.85, Math.sin(a)*r*.85, r*.05, 0, TAU);
      ctx.fillStyle='rgba(255,235,190,'+gl+')'; ctx.fill();
    }
  },
  cyber(r,tier,col){
    const rr = prng(tier+11);
    ctx.lineWidth = Math.max(1, r*.05);
    ctx.strokeStyle='rgba(0,229,255,.55)';
    for(let i=0;i<5;i++){
      const a=rr()*TAU, dx=Math.cos(a)>0?1:-1, dy=Math.sin(a)>0?1:-1;
      let x=0,y=0; ctx.beginPath(); ctx.moveTo(0,0);
      for(let s=0;s<3;s++){
        const st=r*(.18+rr()*.25);
        if(s%2===0) x += dx*st; else y += dy*st;
        ctx.lineTo(x,y);
      }
      ctx.stroke();
      const tt = performance.now();
      const pulse = .45 + .55*Math.abs(Math.sin(tt/520 + i*1.3));
      ctx.beginPath(); ctx.arc(x,y,r*(.05+.025*pulse),0,TAU);
      ctx.fillStyle='rgba(0,229,255,'+pulse+')'; ctx.fill();
      // impulso che viaggia verso il nodo
      const k = ((tt/900 + i*.27) % 1);
      ctx.beginPath(); ctx.arc(x*k, y*k, r*.035, 0, TAU);
      ctx.fillStyle='rgba(180,255,255,'+(1-k)*.9+')'; ctx.fill();
    }
  },
  fiore(r,tier,col){
    const p=shade(col,.28), d=shade(col,-.22);
    ctx.globalAlpha=.75;
    const tt = performance.now();
    for(let i=0;i<6;i++){
      const br = 1 + .09*Math.sin(tt/1100 + i*.9);
      ctx.save(); ctx.rotate(i/6*TAU + Math.sin(tt/2400 + i)*.05);
      ctx.beginPath(); ctx.ellipse(0,-r*.46*br, r*.28*br, r*.46*br, 0, 0, TAU);
      ctx.fillStyle = i%2 ? p : d; ctx.fill(); ctx.restore();
    }
    ctx.globalAlpha=1;
    ctx.beginPath(); ctx.arc(0,0,r*.32,0,TAU); ctx.fillStyle=shade(col,.38); ctx.fill();
  },
  splat(r,tier,col){
    const pal=['#39ff14','#00e5ff','#ff2079','#fff700','#b026ff','#ff6f00','#00ffc8'];
    const rr=prng(tier+5), tt=performance.now();
    for(let i=0;i<8;i++){
      const a=rr()*TAU, d=rr()*r*.8, ph=rr()*6.28;
      const pu = .82 + .35*Math.sin(tt/480 + ph);
      ctx.globalAlpha = .6 + .35*Math.abs(Math.sin(tt/620 + ph));
      ctx.beginPath(); ctx.arc(Math.cos(a)*d, Math.sin(a)*d, r*(.1+rr()*.2)*pu, 0, TAU);
      ctx.fillStyle=pal[Math.floor(rr()*pal.length)]; ctx.fill();
    }
    ctx.globalAlpha=1;
  },
  graff(r,tier,col){
    const pal=['#ff3b5c','#ffd54a','#3ba2d4','#7bd44a','#c084fc','#ff8a3d'];
    const rr=prng(tier+13);
    ctx.lineCap='round'; ctx.globalAlpha=.9;
    for(let i=0;i<4;i++){
      ctx.beginPath();
      ctx.moveTo((rr()*2-1)*r*.8, (rr()*2-1)*r*.8);
      ctx.quadraticCurveTo((rr()*2-1)*r, (rr()*2-1)*r, (rr()*2-1)*r*.8, (rr()*2-1)*r*.8);
      ctx.lineWidth=r*(.09+rr()*.12);
      ctx.strokeStyle=pal[Math.floor(rr()*pal.length)];
      ctx.stroke();
    }
    ctx.globalAlpha=1;
    for(let i=0;i<18;i++){
      const a=rr()*TAU, d=rr()*r;
      ctx.fillStyle='rgba(0,0,0,.12)';
      ctx.fillRect(Math.cos(a)*d, Math.sin(a)*d, r*.05, r*.05);
    }
  },
  vetro(r,tier,col){
    const pal=['#e03a3a','#f0a020','#f5e04a','#3aa84a','#2a7ad0','#7a3ad0','#d03a90'];
    const rr=prng(tier+17), n=8;
    for(let i=0;i<n;i++){
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.arc(0,0,r*.95, i/n*TAU, (i+1)/n*TAU); ctx.closePath();
      ctx.fillStyle=pal[Math.floor(rr()*pal.length)]; ctx.fill();
      ctx.lineWidth=Math.max(1.5, r*.07); ctx.strokeStyle='#14140f'; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0,0,r*.34,0,TAU);
    ctx.fillStyle=pal[Math.floor(rr()*pal.length)]; ctx.fill();
    ctx.lineWidth=Math.max(1.5, r*.07); ctx.strokeStyle='#14140f'; ctx.stroke();
    // riflesso che scorre sul vetro
    const tt = performance.now();
    const off = ((tt/2600 + tier*.17) % 1) * r*3.4 - r*1.7;
    ctx.save(); ctx.rotate(-.5);
    const lg = ctx.createLinearGradient(off - r*.5, 0, off + r*.5, 0);
    lg.addColorStop(0,'rgba(255,255,255,0)');
    lg.addColorStop(.5,'rgba(255,255,255,.38)');
    lg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = lg; ctx.fillRect(-r*1.8, -r*1.8, r*3.6, r*3.6);
    ctx.restore();
  },
  galassia(r,tier,col){
    const tn = performance.now()/3400;
    const blobs=[['rgba(205,60,180,.55)',-.3,-.2,.75],['rgba(60,90,225,.55)',.28,.18,.85],['rgba(255,150,90,.3)',.08,-.36,.5]];
    for(let bi=0;bi<blobs.length;bi++){
      const b = blobs[bi];
      const ox = b[1] + Math.cos(tn + bi*2.1)*.10, oy = b[2] + Math.sin(tn + bi*2.1)*.10;
      const g=ctx.createRadialGradient(ox*r, oy*r, r*.04, ox*r, oy*r, r*b[3]);
      g.addColorStop(0,b[0]); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.fill();
    }
    const rr=prng(tier+23), tt=performance.now();
    ctx.save(); ctx.rotate(tt/14000);
    for(let i=0;i<16;i++){
      const a=rr()*TAU, d=rr()*r*.95, ph=rr()*6.28;
      const tw = .35 + .6*Math.abs(Math.sin(tt/380 + ph));
      ctx.beginPath(); ctx.arc(Math.cos(a)*d, Math.sin(a)*d, r*(.012+rr()*.032)*(.7+tw*.6), 0, TAU);
      ctx.fillStyle='rgba(255,255,255,'+tw+')'; ctx.fill();
    }
    ctx.restore();
  },
  occhio(r,tier,col){
    const ink = '#140406';
    const tt = performance.now();
    const spin = tt/2600;                      // le virgole girano piano
    const breathe = 1 + .12*Math.sin(tt/900);  // la pupilla respira
    const tomoe = (x,y,t,rot) => {
      ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.fillStyle = ink;
      ctx.beginPath(); ctx.arc(0,0,t,0,TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(t*.85,-t*.40);
      ctx.quadraticCurveTo(t*2.7,-t*.30, t*2.1, t*1.6);
      ctx.quadraticCurveTo(t*1.3, t*.35, 0, t*.95);
      ctx.closePath(); ctx.fill(); ctx.restore();
    };
    const ring = (rad, w, c) => {
      ctx.beginPath(); ctx.arc(0,0,rad,0,TAU);
      ctx.lineWidth = w; ctx.strokeStyle = c; ctx.stroke();
    };
    const veins = (c) => {
      ctx.strokeStyle = c; ctx.lineCap='round';
      for(const sg of [-1,1]) for(let i=0;i<4;i++){
        const y = (-1.2 + i*.8) * r*.22;
        ctx.beginPath(); ctx.lineWidth = Math.max(1, r*.045);
        ctx.moveTo(sg*r*.52, y);
        ctx.quadraticCurveTo(sg*r*.78, y*1.15, sg*r*.95, y*1.5 + sg*0);
        ctx.stroke();
      }
    };

    // sclera
    ctx.beginPath(); ctx.arc(0,0,r,0,TAU);
    ctx.fillStyle = (tier===7 || tier===10) ? '#f6f2e6' : '#f3ece0'; ctx.fill();

    const iris = r*.66;
    ctx.beginPath(); ctx.arc(0,0,iris,0,TAU);
    ctx.fillStyle = col; ctx.fill();
    ctx.lineWidth = Math.max(1.5, r*.05); ctx.strokeStyle = ink; ctx.stroke();

    if(tier <= 2){                                   // una, due, tre virgole
      ctx.beginPath(); ctx.arc(0,0,r*.20*breathe,0,TAU); ctx.fillStyle=ink; ctx.fill();
      const n = tier + 1;
      for(let i=0;i<n;i++){
        const a = -Math.PI/2 + i*TAU/n;
        const aa = a + spin;
        tomoe(Math.cos(aa)*iris*.62, Math.sin(aa)*iris*.62, r*.09, aa + 1.2);
      }
    } else if(tier === 3 || tier === 4){             // girandola
      ctx.fillStyle = ink;
      for(let i=0;i<3;i++){
        ctx.save(); ctx.rotate(i*TAU/3 + spin*1.4);
        ctx.beginPath(); ctx.moveTo(0,0);
        ctx.quadraticCurveTo(iris*.75, -iris*.28, iris*.92, iris*.20);
        ctx.quadraticCurveTo(iris*.35, iris*.18, 0, 0);
        ctx.closePath(); ctx.fill(); ctx.restore();
      }
      ctx.beginPath(); ctx.arc(0,0,r*.13,0,TAU); ctx.fillStyle=ink; ctx.fill();
    } else if(tier === 5 || tier === 6){             // anelli concentrici che pulsano
      for(let i=1;i<=4;i++){
        const pz = 1 + .07*Math.sin(tt/700 - i*.8);
        ring(iris*i/4.6*pz, Math.max(1.2, r*.035), 'rgba(20,4,6,.75)');
      }
      ctx.beginPath(); ctx.arc(0,0,r*.12*breathe,0,TAU); ctx.fillStyle=ink; ctx.fill();
    } else if(tier === 7){                           // occhio pallido e venato
      ctx.beginPath(); ctx.arc(0,0,iris*.55,0,TAU);
      ctx.fillStyle='rgba(190,185,210,.55)'; ctx.fill();
      veins('rgba(120,110,140,.8)');
    } else if(tier === 8){                           // pupilla a barra
      ctx.fillStyle = ink;
      ctx.beginPath(); ctx.ellipse(0,0, iris*.86, r*.11, 0, 0, TAU); ctx.fill();
      ring(iris*.92, Math.max(1.2, r*.04), 'rgba(20,4,6,.6)');
    } else if(tier === 9){                           // anelli con sei virgole
      for(let i=1;i<=3;i++) ring(iris*i/3.6, Math.max(1.2, r*.035), 'rgba(20,4,6,.7)');
      for(let i=0;i<6;i++){
        const a = i*TAU/6 + spin*.8;
        tomoe(Math.cos(a)*iris*.70, Math.sin(a)*iris*.70, r*.075, a + 1.2);
      }
      ctx.beginPath(); ctx.arc(0,0,r*.10,0,TAU); ctx.fillStyle=ink; ctx.fill();
    } else {                                         // occhio d oro: anelli, virgole e venature
      const g = ctx.createRadialGradient(0,0,r*.08,0,0,iris);
      g.addColorStop(0,'#fff6c8'); g.addColorStop(1, col);
      ctx.beginPath(); ctx.arc(0,0,iris,0,TAU); ctx.fillStyle=g; ctx.fill();
      for(let i=1;i<=3;i++) ring(iris*i/3.4, Math.max(1.3, r*.04), 'rgba(90,50,10,.75)');
      for(let i=0;i<9;i++){
        const a = i*TAU/9 - spin*1.1;
        tomoe(Math.cos(a)*iris*.74, Math.sin(a)*iris*.74, r*.055, a + 1.2);
      }
      veins('rgba(150,90,20,.55)');
      ctx.beginPath(); ctx.arc(0,0,r*.09,0,TAU); ctx.fillStyle=ink; ctx.fill();
    }

    // palpebre appena accennate
    ctx.strokeStyle='rgba(20,4,6,.35)'; ctx.lineWidth=Math.max(1.5, r*.06);
    ctx.beginPath(); ctx.arc(0,0,r*.97, Math.PI*1.12, Math.PI*1.88); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,r*.97, Math.PI*.12, Math.PI*.88); ctx.stroke();
  },
  app(r,tier,col){
    const g = ctx.createLinearGradient(-r,-r,r,r);
    g.addColorStop(0,'rgba(255,255,255,.35)'); g.addColorStop(1,'rgba(0,0,0,.25)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.fill();
    ctx.fillStyle='#fff'; ctx.strokeStyle='#fff';
    ctx.lineWidth=Math.max(2, r*.11); ctx.lineJoin='round'; ctx.lineCap='round';
    const tt = performance.now();
    const beat = 1 + .09*Math.pow(Math.max(0, Math.sin(tt/620 + tier)), 6) + .03*Math.sin(tt/1400);
    ctx.scale(beat, beat);
    const k = tier % 11, u = r*.42;
    if(k===0){ // fumetto
      ctx.beginPath(); ctx.roundRect(-u, -u*.85, u*2, u*1.5, u*.5); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-u*.2, u*.6); ctx.lineTo(-u*.05, u*1.25); ctx.lineTo(u*.45, u*.6); ctx.closePath(); ctx.fill();
    } else if(k===1){ // cuore
      ctx.beginPath(); ctx.moveTo(0, u);
      ctx.bezierCurveTo(-u*1.7,-u*.2,-u*.6,-u*1.35,0,-u*.45);
      ctx.bezierCurveTo(u*.6,-u*1.35,u*1.7,-u*.2,0,u); ctx.fill();
    } else if(k===2){ // play
      ctx.beginPath(); ctx.moveTo(-u*.6,-u); ctx.lineTo(u, 0); ctx.lineTo(-u*.6, u); ctx.closePath(); ctx.fill();
    } else if(k===3){ // macchina fotografica
      ctx.beginPath(); ctx.roundRect(-u, -u*.7, u*2, u*1.5, u*.4); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, u*.05, u*.45, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(u*.6, -u*.35, u*.1, 0, TAU); ctx.fill();
    } else if(k===4){ // hashtag
      ctx.beginPath();
      ctx.moveTo(-u*.4,-u); ctx.lineTo(-u*.65, u); ctx.moveTo(u*.55,-u); ctx.lineTo(u*.3, u);
      ctx.moveTo(-u,-u*.35); ctx.lineTo(u,-u*.35); ctx.moveTo(-u, u*.35); ctx.lineTo(u, u*.35);
      ctx.stroke();
    } else if(k===5){ // pollice
      ctx.beginPath(); ctx.roundRect(-u, -u*.1, u*.55, u*1.1, u*.15); ctx.fill();
      ctx.beginPath(); ctx.roundRect(-u*.3, -u*.5, u*1.3, u*1.5, u*.3); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-u*.1,-u*.45); ctx.lineTo(u*.35,-u*1.1); ctx.lineTo(u*.55,-u*.4); ctx.closePath(); ctx.fill();
    } else if(k===6){ // campanella
      ctx.beginPath(); ctx.moveTo(-u, u*.5);
      ctx.quadraticCurveTo(-u*.85,-u*.9, 0,-u*.95);
      ctx.quadraticCurveTo(u*.85,-u*.9, u, u*.5); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(0, u*.8, u*.25, 0, TAU); ctx.fill();
    } else if(k===7){ // aeroplanino
      ctx.beginPath(); ctx.moveTo(-u,-u*.5); ctx.lineTo(u,-u*.05); ctx.lineTo(-u, u*.7); ctx.lineTo(-u*.55, u*.05); ctx.closePath(); ctx.fill();
    } else if(k===8){ // stella
      ctx.beginPath();
      for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rad=i%2?u*.45:u;
        const px=Math.cos(a)*rad, py=Math.sin(a)*rad; i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
      ctx.closePath(); ctx.fill();
    } else if(k===9){ // mondo
      ctx.beginPath(); ctx.arc(0,0,u,0,TAU); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0,0,u*.42,u,0,0,TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-u,0); ctx.lineTo(u,0); ctx.stroke();
    } else { // nota musicale
      ctx.beginPath(); ctx.ellipse(-u*.25, u*.55, u*.45, u*.34, -.35, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(u*.12, u*.55); ctx.lineTo(u*.12, -u); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(u*.12, -u); ctx.quadraticCurveTo(u*.9,-u*.75, u*.75,-u*.2); ctx.stroke();
    }
  },
  pelo(r,tier,col){
    const g = ctx.createRadialGradient(-r*.3,-r*.4,r*.1, 0,0,r);
    g.addColorStop(0, shade(col,.22)); g.addColorStop(1, shade(col,-.14));
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.fill();
    if(tier===9){ ctx.fillStyle='#2b2b2b';   // panda
      ctx.beginPath(); ctx.ellipse(-r*.38,-r*.12, r*.24, r*.2, .3, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r*.38,-r*.12, r*.24, r*.2, -.3, 0, TAU); ctx.fill(); }
    if(tier===2){ ctx.fillStyle=shade(col,-.2);  // rana: macchie
      ctx.beginPath(); ctx.arc(-r*.5, r*.3, r*.16, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(r*.45, r*.42, r*.12, 0, TAU); ctx.fill(); }
  },
  sportball(r,tier,col){
    const k = tier % 11;
    (function(){
      const tt = performance.now();
      const off = ((tt/2200 + tier*.2) % 1) * r*3.2 - r*1.6;
      ctx.save(); ctx.rotate(-.7);
      const lg = ctx.createLinearGradient(off - r*.4, 0, off + r*.4, 0);
      lg.addColorStop(0,'rgba(255,255,255,0)');
      lg.addColorStop(.5,'rgba(255,255,255,.26)');
      lg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle = lg; ctx.fillRect(-r*1.6,-r*1.6,r*3.2,r*3.2);
      ctx.restore();
    })();
    ctx.lineWidth = Math.max(1.5, r*.06); ctx.strokeStyle='#1a1a1a';
    if(k===0 || k===6 || k===9){ // calcio
      ctx.fillStyle='#1a1a1a';
      ctx.beginPath();
      for(let i=0;i<5;i++){ const a=-Math.PI/2+i*TAU/5;
        const px=Math.cos(a)*r*.34, py=Math.sin(a)*r*.34; i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
      ctx.closePath(); ctx.fill();
      for(let i=0;i<5;i++){ const a=-Math.PI/2+i*TAU/5+TAU/10;
        ctx.save(); ctx.rotate(a); ctx.beginPath();
        ctx.moveTo(-r*.2, -r*.62); ctx.lineTo(r*.2, -r*.62); ctx.lineTo(0, -r*.92); ctx.closePath();
        ctx.fill(); ctx.restore(); }
    } else if(k===3){ // basket
      ctx.beginPath(); ctx.moveTo(0,-r); ctx.lineTo(0,r); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-r,0); ctx.lineTo(r,0); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0,0,r*.45,r,0,0,TAU); ctx.stroke();
    } else if(k===1){ // tennis
      ctx.strokeStyle='#fff'; ctx.lineWidth=Math.max(2, r*.09);
      ctx.beginPath(); ctx.arc(-r*1.05, 0, r*1.1, -.7, .7); ctx.stroke();
      ctx.beginPath(); ctx.arc(r*1.05, 0, r*1.1, Math.PI-.7, Math.PI+.7); ctx.stroke();
    } else if(k===4){ // baseball
      ctx.strokeStyle='#d83a3a'; ctx.lineWidth=Math.max(1.5, r*.05);
      for(const sgn of [-1,1]){
        ctx.beginPath(); ctx.arc(sgn*r*1.0, 0, r*1.05, sgn>0?Math.PI-.6:-.6, sgn>0?Math.PI+.6:.6); ctx.stroke();
      }
    } else if(k===5){ // biliardo
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,-r*.05, r*.42, 0, TAU); ctx.fill();
      ctx.fillStyle='#1a1a1a'; ctx.font='700 '+Math.round(r*.55)+'px Fredoka, sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('8', 0, -r*.03);
    } else if(k===7){ // pallavolo
      ctx.strokeStyle='#fff'; ctx.lineWidth=Math.max(2, r*.08);
      ctx.beginPath(); ctx.arc(-r*.7,-r*.7, r*1.05, .1, 1.35); ctx.stroke();
      ctx.beginPath(); ctx.arc(r*.8, r*.2, r*1.0, Math.PI+.2, Math.PI+1.5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-r,r*.1); ctx.quadraticCurveTo(0,-r*.2,r,r*.35); ctx.stroke();
    } else if(k===8){ // bowling
      ctx.fillStyle='rgba(0,0,0,.55)';
      ctx.beginPath(); ctx.arc(-r*.2,-r*.3, r*.13, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(r*.18,-r*.38, r*.12, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(0, r*.02, r*.12, 0, TAU); ctx.fill();
    } else if(k===10){ // rugby
      ctx.strokeStyle='#f0e6d2'; ctx.lineWidth=Math.max(2, r*.08);
      ctx.beginPath(); ctx.moveTo(-r*.5,0); ctx.lineTo(r*.5,0); ctx.stroke();
      for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(i*r*.18,-r*.18); ctx.lineTo(i*r*.18,r*.18); ctx.stroke(); }
    } else { // golf: fossette
      ctx.fillStyle='rgba(0,0,0,.10)';
      for(let i=0;i<22;i++){ const a=i*2.4, d=r*.2+((i*7)%10)/10*r*.7;
        ctx.beginPath(); ctx.arc(Math.cos(a)*d, Math.sin(a)*d, r*.08, 0, TAU); ctx.fill(); }
    }
  },
  candy(r,tier,col){
    const rr = prng(tier+53), tt = performance.now();
    ctx.save(); ctx.rotate(.5 + Math.sin(tt/2600)*.12);
    const sc = (tt/40) % (r*.34);
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    for(let i=-5;i<=5;i++) ctx.fillRect(i*r*.34 - r*.06 + sc, -r*1.4, r*.12, r*2.8);
    ctx.restore();
    const pal=['#ff4d6d','#ffd23f','#4dd2ff','#7bf07b','#ff8adf','#fff'];
    for(let i=0;i<12;i++){
      const a=rr()*TAU, d=rr()*r*.8;
      ctx.save(); ctx.translate(Math.cos(a)*d, Math.sin(a)*d); ctx.rotate(rr()*TAU);
      ctx.globalAlpha = .65 + .35*Math.abs(Math.sin(tt/430 + i));
      ctx.fillStyle=pal[Math.floor(rr()*pal.length)];
      ctx.fillRect(-r*.09, -r*.03, r*.18, r*.06);
      ctx.globalAlpha = 1;
      ctx.restore();
    }
  },
  blocco(r,tier,col){
    const n = 8, bs = r/n;
    const rr = prng(tier+41);
    const dk = shade(col,-.26), lt = shade(col,.20), dk2 = shade(col,-.45);
    for(let gy=-n; gy<n; gy++) for(let gx=-n; gx<n; gx++){
      const cx=(gx+.5)*bs, cy=(gy+.5)*bs, d=Math.hypot(cx,cy);
      if(d > r-bs*.15) continue;
      const v = rr();
      let c = v < .22 ? dk : v > .82 ? lt : col;
      if(gx === -n || gy === -n) c = lt;
      if(d > r-bs*1.1) c = dk2;
      ctx.fillStyle=c; ctx.fillRect(gx*bs, gy*bs, bs+.7, bs+.7);
    }
    // bordo alto-sinistra chiaro, basso-destra scuro: sembra un blocco
    if(tier >= 5){
      const tt = performance.now();
      const ph = (tt/1500 + tier*.3) % 1;
      if(ph < .18){
        const al = Math.sin(ph/.18*Math.PI) * .6;
        ctx.fillStyle = 'rgba(255,255,255,'+al+')';
        const gx = (-1 + ph/.18*2) * r*.7;
        ctx.fillRect(gx - bs*.5, -r*.7, bs, r*1.4);
      }
    }
    ctx.fillStyle='rgba(255,255,255,.18)';
    ctx.fillRect(-r*.75, -r*.78, r*1.5, bs);
    ctx.fillStyle='rgba(0,0,0,.25)';
    ctx.fillRect(-r*.75, r*.70, r*1.5, bs);
  },
  pietra(r,tier,col){
    const rr=prng(tier+29);
    ctx.strokeStyle='rgba(70,55,30,.4)'; ctx.lineWidth=Math.max(1, r*.025);
    for(let i=-2;i<=2;i++){
      ctx.beginPath(); ctx.moveTo(-r, i*r*.36); ctx.lineTo(r, i*r*.36); ctx.stroke();
    }
    const tt = performance.now();
    for(let i=0;i<14;i++){
      const gl = Math.max(0, Math.sin(tt/900 - i*.5));
      ctx.fillStyle = gl > .8 ? 'rgba(255,205,120,'+(gl*.75)+')' : 'rgba(70,55,30,.5)';
      ctx.fillRect((rr()*2-1)*r*.75, (rr()*2-1)*r*.8, r*.09, r*.15);
    }
  }
};

const ZOO = ['gatto','cane','rana','volpe','maiale','pulcino','gufo','orso','lupo','panda','leone'];
const DECO = {
  zoo(r, tier){
    const a = ZOO[tier % 11];
    const tt = performance.now();
    const tw = ((tt/2400 + tier*.37) % 1) < .09 ? Math.sin(((tt/2400 + tier*.37)%1)/.09*Math.PI)*.22 : 0;
    ctx.rotate(tw*.12);
    const fur = skin().cols[tier];
    const dark = shade(fur, -.30), light = shade(fur, .30);
    ctx.lineWidth = Math.max(1.4, r*.06); ctx.strokeStyle = INK(); ctx.lineCap='round';

    // orecchie
    ctx.fillStyle = fur;
    if(a==='gatto' || a==='volpe' || a==='lupo'){
      for(const sg of [-1,1]){
        ctx.beginPath();
        ctx.moveTo(sg*r*.30, -r*.80); ctx.lineTo(sg*r*.72, -r*1.22); ctx.lineTo(sg*r*.80, -r*.62);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(sg*r*.42, -r*.78); ctx.lineTo(sg*r*.66, -r*1.05); ctx.lineTo(sg*r*.70, -r*.66);
        ctx.closePath(); ctx.fillStyle='rgba(255,180,190,.85)'; ctx.fill(); ctx.fillStyle=fur;
      }
    } else if(a==='cane' || a==='orso' || a==='panda' || a==='leone'){
      if(a==='leone'){
        ctx.fillStyle = shade(fur,-.18);
        for(let i=0;i<14;i++){ const an=i/14*TAU;
          ctx.beginPath(); ctx.arc(Math.cos(an)*r*.95, Math.sin(an)*r*.95, r*.22, 0, TAU); ctx.fill(); }
        ctx.fillStyle = fur;
      }
      for(const sg of [-1,1]){
        ctx.beginPath();
        ctx.ellipse(sg*r*.66, a==='cane' ? -r*.36 : -r*.76, r*.20, a==='cane' ? r*.34 : r*.20, 0, 0, TAU);
        ctx.fillStyle = (a==='panda') ? '#2b2b2b' : fur; ctx.fill(); ctx.stroke();
      }
    } else if(a==='maiale'){
      for(const sg of [-1,1]){
        ctx.beginPath(); ctx.moveTo(sg*r*.36,-r*.78); ctx.lineTo(sg*r*.66,-r*1.05); ctx.lineTo(sg*r*.74,-r*.60);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      }
    } else if(a==='gufo'){
      for(const sg of [-1,1]){
        ctx.beginPath(); ctx.moveTo(sg*r*.30,-r*.82); ctx.lineTo(sg*r*.60,-r*1.14); ctx.lineTo(sg*r*.68,-r*.70);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      }
    }

    // muso chiaro
    if(a!=='rana' && a!=='pulcino'){
      ctx.beginPath(); ctx.ellipse(0, r*.28, r*.46, r*.34, 0, 0, TAU);
      ctx.fillStyle = light; ctx.fill();
    }

    // occhi
    const eo = (a==='rana') ? r*.42 : r*.32, eyY = (a==='rana') ? -r*.55 : -r*.16;
    for(const sg of [-1,1]){
      if(a==='rana'){
        ctx.beginPath(); ctx.arc(sg*eo, eyY, r*.30, 0, TAU);
        ctx.fillStyle=light; ctx.fill(); ctx.stroke();
      }
      ctx.beginPath(); ctx.ellipse(sg*eo, eyY, r*.17, r*.20, 0, 0, TAU);
      ctx.fillStyle='#fff'; ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(sg*eo, eyY + r*.02, r*.10, 0, TAU);
      ctx.fillStyle=INK(); ctx.fill();
      ctx.beginPath(); ctx.arc(sg*eo - r*.04, eyY - r*.05, r*.035, 0, TAU);
      ctx.fillStyle='#fff'; ctx.fill();
    }

    // naso e bocca
    ctx.fillStyle = INK();
    if(a==='maiale'){
      ctx.beginPath(); ctx.ellipse(0, r*.30, r*.24, r*.17, 0, 0, TAU);
      ctx.fillStyle='#f18fae'; ctx.fill(); ctx.stroke();
      ctx.fillStyle=INK();
      ctx.beginPath(); ctx.arc(-r*.09, r*.30, r*.045, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(r*.09, r*.30, r*.045, 0, TAU); ctx.fill();
    } else if(a==='pulcino' || a==='gufo'){
      ctx.beginPath(); ctx.moveTo(-r*.14, r*.16); ctx.lineTo(r*.14, r*.16); ctx.lineTo(0, r*.44);
      ctx.closePath(); ctx.fillStyle='#f5a623'; ctx.fill(); ctx.stroke();
    } else if(a==='rana'){
      ctx.beginPath(); ctx.moveTo(-r*.42, r*.22); ctx.quadraticCurveTo(0, r*.62, r*.42, r*.22);
      ctx.lineWidth=Math.max(1.6,r*.075); ctx.strokeStyle=INK(); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.ellipse(0, r*.16, r*.11, r*.085, 0, 0, TAU); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, r*.22); ctx.lineTo(0, r*.34);
      ctx.moveTo(0, r*.34); ctx.quadraticCurveTo(-r*.16, r*.46, -r*.22, r*.30);
      ctx.moveTo(0, r*.34); ctx.quadraticCurveTo(r*.16, r*.46, r*.22, r*.30);
      ctx.lineWidth=Math.max(1.4,r*.055); ctx.strokeStyle=INK(); ctx.stroke();
    }
  }
};

function drawHat(kind, r, tier){
  if(kind === 'helmet'){
    if(tier < 4) return;
    ctx.save();
    ctx.beginPath(); ctx.arc(0,0,r*1.02,0,TAU);
    ctx.fillStyle='rgba(190,225,255,.16)'; ctx.fill();
    ctx.lineWidth=Math.max(2, r*.11); ctx.strokeStyle='rgba(235,245,255,.9)'; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,r*.82, Math.PI*1.08, Math.PI*1.45);
    ctx.lineWidth=Math.max(1.5, r*.07); ctx.strokeStyle='rgba(255,255,255,.65)'; ctx.stroke();
    ctx.restore();
  }
  else if(kind === 'tophat'){
    if(tier < 5) return;
    ctx.save();
    ctx.fillStyle='#14100c';
    ctx.beginPath(); ctx.ellipse(0, -r*.80, r*.62, r*.13, 0, 0, TAU); ctx.fill();
    ctx.fillRect(-r*.34, -r*1.30, r*.68, r*.52);
    ctx.fillStyle='#8c6239';
    ctx.fillRect(-r*.34, -r*.95, r*.68, r*.12);
    ctx.restore();
  }
}


function drawBall(x, y, angle, tier, vx, vy, k, ax, ay, pop, special, eating, lv, dk, dax, day, offs, seed){
  lv = lv || 1; dk = dk || 0; dax = dax || 0; day = day === undefined ? 1 : day;
  const nowT = performance.now(); seed = seed || 0;
  const sk = skin(), r = R(tier);
  const col = special === 'regress' ? '#2b1140' : special === 'jolly' ? '#6b2fa0' : sk.cols[tier];
  const painter = special ? null : (sk.paint ? PAINT[sk.paint] : null);
  const raw = !!sk.raw && !special;
  ctx.save();
  ctx.translate(x,y);

  if(k > .002){
    const th = Math.atan2(ay, ax) + Math.PI/2;   // asse di compressione su Y locale
    ctx.rotate(th);
    ctx.translate(0, r*k*0.95);                  // il fondo resta piantato
    ctx.scale(1 + k*.62, 1 - k);
    ctx.rotate(-th);
  }
  if(dk && Math.abs(dk) > .002){
    const th2 = Math.atan2(day, dax) + Math.PI/2;
    ctx.rotate(th2);
    ctx.scale(1 + dk*.70, 1 - dk);
    ctx.rotate(-th2);
  }
  if(pop > 0){ const s = 1 + pop*.22; ctx.scale(s, 2-s); }
  ctx.rotate(angle);

  if(lv > 1 && !special){
    const lc = lvColor(lv);
    const pul = .42 + .16*Math.sin(performance.now()/420 + tier);
    const au = ctx.createRadialGradient(0,0,r*.80, 0,0,r*1.52);
    au.addColorStop(0, withA(lc, pul));
    au.addColorStop(.55, withA(lc, pul*.35));
    au.addColorStop(1, withA(lc, 0));
    ctx.fillStyle = au;
    ctx.beginPath(); ctx.arc(0,0,r*1.52,0,Math.PI*2); ctx.fill();
  }
  if(sk.glow && !special){
    ctx.shadowColor = (sk.glowCols ? sk.glowCols[tier] : col);
    ctx.shadowBlur = r*.55;
  }
  if(!raw){
    shapePath(r, offs, nowT, seed);
    ctx.fillStyle = col; ctx.fill();
  }
  ctx.shadowBlur = 0;

  if(painter){
    ctx.save();
    if(!raw){ shapePath(r, offs, nowT, seed); ctx.clip(); }
    painter(r, tier, col);
    ctx.restore();
  }

  if(!raw){
    shapePath(r, offs, nowT, seed);
    const g = ctx.createRadialGradient(-r*.32,-r*.38,r*.08, 0,0,r);
    g.addColorStop(0,'rgba(255,255,255,.34)');
    g.addColorStop(.5,'rgba(255,255,255,0)');
    g.addColorStop(1,'rgba(0,0,0,.22)');
    ctx.fillStyle=g; ctx.fill();
    ctx.lineWidth=Math.max(2, r*.10); ctx.strokeStyle=INK(); ctx.stroke();
  }

  if(eating){
    ctx.beginPath(); ctx.arc(0,0,r+4,0,Math.PI*2);
    ctx.lineWidth=2.5; ctx.strokeStyle='rgba(255,213,74,.85)'; ctx.stroke();
  }
  if(special === 'jolly'){
    ctx.save();
    shapePath(r, offs, nowT, seed); ctx.clip();
    ctx.fillStyle = '#ffd54a';
    for(let gy=-3; gy<=3; gy++) for(let gx=-3; gx<=3; gx++){
      if((gx+gy) % 2) continue;
      ctx.save(); ctx.translate(gx*r*.42, gy*r*.42); ctx.rotate(Math.PI/4);
      ctx.fillRect(-r*.15, -r*.15, r*.3, r*.3); ctx.restore();
    }
    ctx.restore();
    ctx.lineWidth=Math.max(2, r*.10); ctx.strokeStyle=INK();
    shapePath(r, offs, nowT, seed); ctx.stroke();
    // faccia furba
    const ex = r*.34;
    ctx.lineWidth=Math.max(1.4,r*.085); ctx.strokeStyle=INK(); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-ex-r*.18,-r*.06); ctx.quadraticCurveTo(-ex,-r*.30,-ex+r*.18,-r*.06); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(ex,-r*.10, r*.16, r*.19, 0, 0, Math.PI*2);
    ctx.fillStyle='#fff'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(ex,-r*.08, r*.09, 0, Math.PI*2); ctx.fillStyle=INK(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-r*.26, r*.34); ctx.quadraticCurveTo(0, r*.62, r*.26, r*.30);
    ctx.lineWidth=Math.max(1.5,r*.08); ctx.strokeStyle=INK(); ctx.stroke();
    // cappello a tre punte con campanelli
    const pts = [[-1,-.30],[0,-.55],[1,-.30]];
    for(const [sg,dy] of pts){
      ctx.beginPath();
      ctx.moveTo(sg*r*.30, -r*.78);
      ctx.quadraticCurveTo(sg*r*.95, -r*(1.05 - dy*.3), sg*r*.80, -r*(1.35 + dy*.2));
      ctx.quadraticCurveTo(sg*r*.30, -r*1.15, sg*r*.05, -r*.80);
      ctx.closePath();
      ctx.fillStyle = sg < 0 ? '#e8434f' : sg > 0 ? '#2f7ad0' : '#2fbf5a';
      ctx.fill(); ctx.lineWidth=Math.max(1.4,r*.055); ctx.strokeStyle=INK(); ctx.stroke();
      ctx.beginPath(); ctx.arc(sg*r*.80, -r*(1.35 + dy*.2), r*.10, 0, Math.PI*2);
      ctx.fillStyle='#ffd54a'; ctx.fill(); ctx.stroke();
    }
    ctx.restore();
    return;
  }
  if(special === 'regress'){
    ctx.save(); ctx.rotate(performance.now()/300);
    ctx.beginPath(); ctx.arc(0,0,r*.78,0,Math.PI*1.4);
    ctx.lineWidth=Math.max(2,r*.09); ctx.strokeStyle='rgba(190,120,255,.85)'; ctx.stroke();
    ctx.restore();
  }

  if(lv > 1 && !special){
    const lc = lvColor(lv);
    ctx.save();
    ctx.beginPath(); ctx.arc(0,0,r - Math.max(2, r*.10), 0, Math.PI*2);
    ctx.lineWidth = Math.max(2, r*.11); ctx.strokeStyle = lc;
    ctx.shadowColor = lc; ctx.shadowBlur = r*.35;
    ctx.stroke();
    ctx.restore();
    const n = Math.min(6, lv - 1);
    for(let i=0;i<n;i++){
      const a = Math.PI/2 + (i - (n-1)/2) * .30;
      ctx.beginPath();
      ctx.arc(Math.cos(a)*r*.72, Math.sin(a)*r*.72, Math.max(1.5, r*.075), 0, Math.PI*2);
      ctx.fillStyle = lc; ctx.fill();
      ctx.lineWidth = Math.max(1, r*.03); ctx.strokeStyle = INK(); ctx.stroke();
    }
  }
  if(!special && sk.deco && DECO[sk.deco]) DECO[sk.deco](r, tier);
  if(special || (sk.eyes || 'normal') !== 'none'){
    drawFace(special === 'regress' ? 'xx' : FACES[tier], r, vx, vy, k, col,
             special ? 'normal' : (sk.eyes || 'normal'), seed);
  }
  if(!special && sk.hat) drawHat(sk.hat, r, tier);
  ctx.restore();
}
